name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run still going for the old commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # GitHub's Ubuntu runners include Docker, so Testcontainers starts a real Postgres 18.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # First, the steps a developer follows on a fresh clone.
      - run: cp .env.example .env
      - name: Start Postgres and wait until it is healthy
        run: docker compose up -d --wait db
      - run: npm run db:migrate
      - name: Seed twice (the second run must add nothing)
        run: |
          npm run db:seed
          npm run db:seed 2>&1 | tee seed.log
          grep -q 'all were already there' seed.log
      - run: npm run build
      - name: Start the API
        run: |
          NODE_ENV=production node --env-file=.env dist/server.js > api.log 2>&1 &
          echo $! > api.pid
          for attempt in $(seq 1 30); do
            curl -fs http://localhost:3000/health && exit 0
            sleep 1
          done
          echo "The API did not start"; exit 1
      - name: /ready returns 200 while the database is up
        run: curl -fsS http://localhost:3000/ready
      - name: The built app serves the docs, and their demo login works
        run: |
          curl -fsS http://localhost:3000/openapi.json -o openapi.json
          jq -e '.openapi == "3.1.0"' openapi.json
          curl -fsS http://localhost:3000/docs | grep -q '/docs/swagger-ui-bundle.js'
          for file in init.js swagger-ui-bundle.js swagger-ui.css; do
            curl -fsS -o /dev/null "http://localhost:3000/docs/$file"
          done
          jq -c '.paths["/api/v1/auth/login"].post.requestBody.content["application/json"].examples.alice.value' openapi.json |
            curl -fsS -H 'Content-Type: application/json' --data-binary @- http://localhost:3000/api/v1/auth/login |
            jq -e '.accessToken | length > 0'
      - name: /ready returns 503 once the database stops
        run: |
          docker compose stop db
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ready)
          echo "GET /ready -> $status"
          test "$status" = 503
      - name: /health still answers, so the API survived losing its database
        run: curl -fsS http://localhost:3000/health
      - name: Stop the development setup
        run: |
          kill "$(cat api.pid)"
          docker compose down --volumes

      # Then the demo a reviewer runs: everything in containers, from the same .env.
      - name: docker compose up --build
        run: docker compose up --build --detach
      - name: The API container turns healthy
        run: |
          api=$(docker compose ps --quiet api)
          for attempt in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$api")
            if [ "$status" = healthy ]; then docker compose ps; exit 0; fi
            sleep 2
          done
          echo "The API is $status"; docker compose ps --all; exit 1
      - name: migrate prepared the database and added the demo data
        run: |
          docker compose logs --no-color migrate | tee migrate.log
          test "$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps --all --quiet migrate)")" = 0
          grep -q 'Seed added 3 users, 5 events and 4 bookings' migrate.log
      - name: /docs works, and the demo login from the docs logs in
        run: |
          curl -fsS http://localhost:3000/docs | grep -q '/docs/swagger-ui-bundle.js'
          curl -fsS http://localhost:3000/openapi.json -o openapi.json
          token=$(jq -c '.paths["/api/v1/auth/login"].post.requestBody.content["application/json"].examples.alice.value' openapi.json |
            curl -fsS -H 'Content-Type: application/json' --data-binary @- http://localhost:3000/api/v1/auth/login |
            jq -er .accessToken)
          curl -fsS -H "Authorization: Bearer $token" http://localhost:3000/api/v1/users/me | jq -e '.email == "alice@kursi.test"'
          curl -fsS http://localhost:3000/api/v1/events | jq -e '.meta.total == 3'
      - name: The API runs as node, with no TypeScript sources, tests or dev tools
        run: |
          test "$(docker compose exec -T api whoami)" = node
          docker compose exec -T api ls -A /app
          docker compose exec -T api sh -c '
            test ! -e src && test ! -e tests && test ! -e tsconfig.json &&
            test -z "$(find . -name "*.ts" -not -path "./node_modules/*")" &&
            for tool in typescript tsx vitest eslint drizzle-kit pino-pretty supertest; do
              test ! -e "node_modules/$tool" || { echo "found $tool"; exit 1; }
            done'
          docker image ls kursi
      - name: migrate run again adds nothing, and SEED_DEMO_DATA=false skips the demo data
        run: |
          docker compose run --rm migrate 2>&1 | tee again.log
          grep -q 'all were already there' again.log
          docker compose run --rm -e SEED_DEMO_DATA=false migrate 2>&1 | tee skipped.log
          grep -q 'Skipped the demo data' skipped.log
      - name: docker compose down stops the API cleanly within a few seconds
        run: |
          api=$(docker compose ps --quiet api)
          start=$(date +%s)
          docker compose stop api
          seconds=$(( $(date +%s) - start ))
          code=$(docker inspect --format '{{.State.ExitCode}}' "$api")
          echo "Stopped in ${seconds}s with exit code $code"
          test "$code" = 0
          test "$seconds" -le 5
          docker compose logs --no-color api | grep -q 'Shutdown complete'
          docker compose down --volumes
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color || true
      - name: API log
        if: always()
        run: cat api.log || true

  docker:
    name: Docker image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      # Report both architectures, even when one fails.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          # Apple Silicon Macs and ARM servers run this one. GitHub's arm64 runners are free for
          # public repositories and build natively, without emulation.
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Lint the Dockerfile
        if: matrix.arch == 'amd64'
        run: |
          # Each finding becomes an annotation on the Dockerfile, shown in the pull request.
          status=0
          docker run --rm -i hadolint/hadolint:v2.15.1 /bin/hadolint --format json - \
            < Dockerfile > hadolint.json || status=$?
          if [ -s hadolint.json ]; then
            jq -r '.[] | "::\(if .level == "error" then "error" else "warning" end) file=Dockerfile,line=\(.line),title=hadolint \(.code)::\(.message)"' hadolint.json
          fi
          if [ "$status" != 0 ]; then echo "::error title=hadolint::hadolint exited with code $status"; fi
          exit "$status"
      # Third-party actions are pinned to a commit; Dependabot keeps the pins current.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image, without pushing it
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: kursi:ci
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      # argon2 is the one native module: its prebuilt binary must match the architecture.
      - name: argon2 works on ${{ matrix.arch }}
        run: >-
          docker run --rm kursi:ci node --input-type=module -e
          "import argon2 from 'argon2'; await argon2.hash('check'); console.log('argon2 works on', process.arch)"
      - name: The image turns healthy on its own, and stops cleanly
        run: |
          # No database needed: /health checks only that the process serves HTTP.
          docker run --detach --name kursi \
            -e DATABASE_URL=postgres://kursi:kursi@127.0.0.1:5432/kursi \
            -e JWT_ACCESS_SECRET=ci-only-secret-that-is-at-least-32-characters \
            kursi:ci
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' kursi)
            if [ "$status" = healthy ]; then break; fi
            sleep 2
          done
          echo "Health: $status"
          test "$status" = healthy
          docker stop kursi
          docker logs kursi
          test "$(docker inspect --format '{{.State.ExitCode}}' kursi)" = 0
      - name: Image size
        run: docker image ls kursi:ci --format 'kursi:ci on ${{ matrix.arch }} is {{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"
